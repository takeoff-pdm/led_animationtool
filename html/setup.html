<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Add some basic styling for the navigation bar */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    nav {
      background-color: #333;
      overflow: hidden;
    }

    nav a {
      float: left;
      display: block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }

    nav a:hover {
      background-color: #ddd;
      color: black;
    }

     /* Color sequences */
     .add-chunk-btn {
      display: block;
      margin: 20px 20%;
      padding: 10px 20px;
      background-color: #664caf;
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .chunk-list {
      list-style-type: none;
      padding: 0;
    }

    .chunk-item {
      margin: 10px 7%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;

      display: grid;
      grid-auto-flow: column;
      align-items: center;
    }

    .dropdown {
      margin-right: 10px;
    }

    .text-area {
      margin-bottom: 10px;
      max-width: 6rem;
      padding: 5px;
      box-sizing: border-box;
    }

    .update-btn {
        background-color: rgb(38, 201, 250);
        color: white;
        font-size: 16px;
        border: none;
        padding: 10px 0;
        border-radius: 10px;
        cursor: pointer;
    }

    .delete-btn {
        margin-left: 8px;
        background-color: rgb(255, 52, 16);
        color: white;
        font-size: 16px;
        border: none;
        padding: 10px 0;
        border-radius: 10px;
        cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Navigation bar -->
<nav>
  <a href="/">Home</a>
  <a href="colors">Colors</a>
  <a href="setup">Setup</a>
  <a href="settings">Settings</a>
</nav>

<!-- Add Chunk button -->
<a href="setup/create-chunk" class="add-chunk-btn">Add Chunk</a>

<!-- Chunk List -->
<ul class="chunk-list">
  <li class="chunk-item">
    <strong>Decke links</strong>
    <input type="number" class="text-area start" id="start-1" placeholder="Start-Pixel"></input>
    <input type="number" class="text-area end" id="end-1" placeholder="End-Pixel"></input>

    <label for="reverse-1" class="reverse-checkbox">
    <input type="checkbox" id="reverse2" name="reverse-1"> Reverse
    </label>

    <button class="update-btn">Update</button>
    <button class="delete-btn">Delete</button>
  </li>
  <li class="chunk-item">
    <strong>Decke mitte</strong>
    <input type="number" class="text-area start" id="start-1" placeholder="Start-Pixel"></input>
    <input type="number" class="text-area end" id="end-1" placeholder="End-Pixel"></input>

    <label for="reverse-1" class="reverse-checkbox">
    <input type="checkbox" id="reverse2" name="reverse-1"> Reverse
    </label>

    <button class="update-btn">Update</button>
    <button class="delete-btn">Delete</button>
  </li>
  <li class="chunk-item">
    <strong>Decke rechts</strong>
    <input type="number" class="text-area start" id="start-1" placeholder="Start-Pixel"></input>
    <input type="number" class="text-area end" id="end-1" placeholder="End-Pixel"></input>

    <label for="reverse-1" class="reverse-checkbox">
    <input type="checkbox" id="reverse2" name="reverse-1"> Reverse
    </label>

    <button class="update-btn">Update</button>
    <button class="delete-btn">Delete</button>
  </li>
  <li class="chunk-item">
    <strong>Wand</strong>
    <input type="number" class="text-area start" id="start-1" placeholder="Start-Pixel"></input>
    <input type="number" class="text-area end" id="end-1" placeholder="End-Pixel"></input>

    <label for="reverse-1" class="reverse-checkbox">
    <input type="checkbox" id="reverse2" name="reverse-1"> Reverse
    </label>

    <button class="update-btn">Update</button>
    <button class="delete-btn">Delete</button>
  </li>
  <!-- Add more items as needed -->
</ul>

</body>
</html>
