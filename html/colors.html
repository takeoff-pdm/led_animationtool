<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Add some basic styling for the navigation bar */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    nav {
      background-color: #333;
      overflow: hidden;
    }

    nav a {
      float: left;
      display: block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }

    nav a:hover {
      background-color: #ddd;
      color: black;
    }

    h1 {
      text-align: center;
    }

    /* Color sequences */
    .add-sequence-btn {
      display: block;
      margin: 20px 20%;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .color-sequence-list {
      list-style-type: none;
      padding: 0;
    }

    .color-sequence-item {
      margin: 10px 12%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;

      display: flex;
      justify-content: center;
    }

    .edit-btn {
      background-color: #333;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      margin-left: 50%;
    }
  </style>
</head>
<body>

<!-- Navigation bar -->
<nav>
  <a href="/">Home</a>
  <a href="colors">Colors</a>
  <a href="setup">Setup</a>
  <a href="settings">Settings</a>
</nav>

<h1>Color Sequences</h1>

<!-- Add Color Sequence button -->
<a href="colors/create-sequence" class="add-sequence-btn">Add Color Sequence</a>

<!-- Color Sequence List -->
<ul class="color-sequence-list">
  <li class="color-sequence-item">
    <strong>Sequence 1</strong>
    <button class="edit-btn">Edit</button>
  </li>
  <li class="color-sequence-item">
    <strong>Sequence 2</strong>
    <button class="edit-btn">Edit</button>
  </li>
  <!-- Add more items as needed -->
</ul>

</body>
</html>
